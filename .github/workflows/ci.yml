name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Build example context bundle
        run: |
          prompt-context-gate build --root . --manifest examples/manifest.txt -f json -o reports/example-context.json
          prompt-context-gate inspect reports/example-context.json -f json -o reports/example-inspection.json
          python -m json.tool reports/example-context.json > /dev/null
          python -m json.tool reports/example-inspection.json > /dev/null
          prompt-context-gate check reports/example-context.json -r examples/rules.json -f json
      - name: Run example gate
        run: prompt-context-gate check examples/good-context.md -r examples/rules.json -f json
      - name: Run SARIF smoke
        run: |
          set +e
          prompt-context-gate check examples/risky-context.json -r examples/rules.json -f sarif -o reports/context-gate.sarif
          status=$?
          set -e
          test "$status" -eq 2
          python -m json.tool reports/context-gate.sarif > /dev/null
