[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-context-gate"
version = "0.4.0"
description = "Local policy gate for AI coding context bundles."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "prompt-context-gate contributors" }]
keywords = ["ai", "developer-tools", "codex", "claude-code", "context", "security", "ci", "prompt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
prompt-context-gate = "prompt_context_gate.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/prompt-context-gate"
Repository = "https://github.com/yanqr213/prompt-context-gate"
Issues = "https://github.com/yanqr213/prompt-context-gate/issues"
Changelog = "https://github.com/yanqr213/prompt-context-gate/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
